function changeImage(n){const gallery=document.getElementById('gallery');if(!gallery||gallery.dataset.busy)return;const s=get(state.serviceId),nextIndex=(state.gallery+n+s.images.length)%s.images.length;gallery.dataset.busy='1';const old=gallery.querySelector('.gallery-photo.current'),next=new Image();next.className='gallery-photo incoming';next.alt=`Фото процедури: ${s.name}`;next.onload=()=>{gallery.insertBefore(next,old.nextSibling);requestAnimationFrame(()=>{next.classList.add('visible');old.classList.add('leaving')});setTimeout(()=>{old.remove();next.className='gallery-photo current';gallery.dataset.busy='';},570);state.gallery=nextIndex;gallery.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('active',i===nextIndex))};next.onerror=()=>{gallery.dataset.busy='';notify('Не вдалося завантажити фото')};next.src=image(s.images[nextIndex],1200)}
function formPage(){const f=state.form;const dates=Array.from({length:14},(_,i)=>{let d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+i);return {iso:`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,day:new Intl.DateTimeFormat('uk-UA',{weekday:'short'}).format(d),num:d.getDate()}});const selected=get(f.serviceId);const isPast=t=>f.date===today()&&new Date(`${f.date}T${t}:00`)<=new Date();return `<div class="view-head"><button class="back" aria-label="Назад" onclick="back()">${svg('arrow')}</button><div><div class="eyebrow">Крок 1 із 2</div><h2>Запис на послугу</h2></div></div><p class="form-intro">Заповніть кілька деталей, і ми підготуємо для вас ідеальний час.</p><div class="form-card"><div class="field"><label for="name">Ім’я</label><input id="name" autocomplete="off" placeholder="Ваше ім’я" value="${escapeHtml(f.name)}" oninput="updateField('name',this.value)">${err('name')}</div><div class="field"><label for="phone">Номер телефону</label><input id="phone" type="tel" autocomplete="off" inputmode="tel" placeholder="+380 99 123 45 67" value="${escapeHtml(f.phone)}" oninput="updateField('phone',this.value)">${err('phone')}</div><div class="field"><label for="service">Обрана послуга</label><select id="service" onchange="changeFormService(this.value)">${services.map(s=>`<option value="${s.id}" ${f.serviceId===s.id?'selected':''}>${s.name} · ${money(s.price)}</option>`).join('')}</select>${err('serviceId')}</div><div class="field"><label for="specialist">Спеціаліст</label><select id="specialist" onchange="updateField('specialist',this.value)"><option value="${selected.specialist}" selected>${selected.specialist} · ${selected.role}</option></select>${err('specialist')}</div><div class="field"><span class="label">Майбутня дата</span><div class="date-list">${dates.map(d=>`<button class="date-btn ${f.date===d.iso?'selected':''}" onclick="chooseDate('${d.iso}')"><span>${d.day}</span><strong>${d.num}</strong></button>`).join('')}</div>${err('date')}</div><div class="field"><span class="label">Майбутній час</span><div class="time-list">${slots.map(t=>`<button class="time-btn ${f.time===t?'selected':''}" onclick="chooseTime('${t}')" ${!f.date||isPast(t)?'disabled':''}>${t}</button>`).join('')}</div>${err('time')}</div></div><button class="primary" style="margin-top:20px" onclick="submitForm()">Перевірити дані</button>`}
function err(k){return state.errors[k]?`<p class="error" role="alert">${state.errors[k]}</p>`:''}
function showFormErrors(){document.querySelectorAll('.form-card .error').forEach(el=>el.remove());const targets={name:'#name',phone:'#phone',serviceId:'#service',specialist:'#specialist',date:'.date-list',time:'.time-list'};for(const [key,message] of Object.entries(state.errors)){document.querySelector(targets[key])?.closest('.field')?.insertAdjacentHTML('beforeend',`<p class="error" role="alert">${message}</p>`)}}
function updateField(k,v){state.form[k]=v;delete state.errors[k];persist();document.querySelector('#'+k)?.parentElement.querySelector('.error')?.remove()}
function changeFormService(id){state.form.serviceId=id;state.form.specialist=get(id).specialist;state.serviceId=id;document.querySelector('#specialist').innerHTML=`<option value="${get(id).specialist}">${get(id).specialist} · ${get(id).role}</option>`;persist()}
function chooseDate(iso){state.form.date=iso;state.form.time='';delete state.errors.date;delete state.errors.time;persist();document.querySelectorAll('.date-btn').forEach(b=>b.classList.toggle('selected',b.getAttribute('onclick').includes(iso)));document.querySelectorAll('.time-btn').forEach(b=>{b.classList.remove('selected');b.disabled=iso===today()&&new Date(`${iso}T${b.textContent.trim()}:00`)<=new Date()});document.querySelector('.date-list')?.closest('.field')?.querySelector('.error')?.remove();document.querySelector('.time-list')?.closest('.field')?.querySelector('.error')?.remove()}
function chooseTime(t){state.form.time=t;delete state.errors.time;persist();document.querySelectorAll('.time-btn').forEach(b=>b.classList.toggle('selected',b.textContent.trim()===t));document.querySelector('.time-list')?.closest('.field')?.querySelector('.error')?.remove()}
function submitForm(){const f=state.form,e={};if(!f.name.trim()||f.name.trim().length<2)e.name='Вкажіть, будь ласка, ваше ім’я.';if(!/^\+?\d[\d\s()\-]{8,}$/.test(f.phone.trim()))e.phone='Вкажіть коректний номер телефону.';if(!f.serviceId)e.serviceId='Оберіть послугу.';if(!f.specialist)e.specialist='Оберіть спеціаліста.';if(!f.date||f.date<today())e.date='Оберіть майбутню дату.';if(!f.time||!slots.includes(f.time)||new Date(`${f.date}T${f.time}:00`)<=new Date())e.time='Оберіть доступний майбутній час.';state.errors=e;if(Object.keys(e).length){showFormErrors();notify('Перевірте, будь ласка, поля форми');return}state.modal='review';renderModalNow()}
function summary(){const f=state.form;return `<div class="summary-line"><span>Ім’я</span><strong>${escapeHtml(f.name)}</strong></div><div class="summary-line"><span>Телефон</span><strong>${escapeHtml(f.phone)}</strong></div><div class="summary-line"><span>Послуга</span><strong>${get(f.serviceId).name}</strong></div><div class="summary-line"><span>Спеціаліст</span><strong>${escapeHtml(f.specialist)}</strong></div><div class="summary-line"><span>Дата</span><strong>${dateLabel(f.date)}</strong></div><div class="summary-line"><span>Час</span><strong>${f.time}</strong></div>`}
function confirmAppointment(){const f={...state.form};let code;do{code=String(Math.floor(100000+Math.random()*900000))}while(state.appointments.some(a=>a.code===code));const appointment={...f,code,id:Date.now(),status:'В обробці'};state.appointments.unshift(appointment);state.newAppointment=appointment;const i=state.cart.indexOf(f.serviceId);if(i>=0)state.cart.splice(i,1);state.form={name:'',phone:'',serviceId:'',specialist:'',date:'',time:''};persist();animateModalOut(()=>{state.modal='success';renderModalNow();syncCartBadge()})}
function reviewModal(){return `<div class="modal-wrap" onclick="if(event.target===this)closeModal()"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-handle"></div><span class="eyebrow">Майже готово</span><h2 id="modal-title">Перевірка даних</h2><p class="lead">Переконайтеся, що все правильно перед підтвердженням запису.</p>${summary()}<div class="modal-actions"><button class="secondary" onclick="closeModal()">Назад</button><button class="primary" onclick="confirmAppointment()">Далі</button></div></div></div>`}
function successModal(){const a=state.newAppointment;return `<div class="modal-wrap"><div class="modal success-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-handle"></div><div class="success-icon">${svg('check')}</div><span class="eyebrow">Ваш час зарезервовано</span><h2 id="modal-title">Запис успішно створено</h2><p class="lead">Дякуємо, ${escapeHtml(a.name)}! Ми з нетерпінням чекаємо на зустріч. Статус запису — в обробці.</p><div class="confirmation-code"><span>Код підтвердження</span><strong>${a.code}</strong></div><div class="summary-line"><span>Послуга</span><strong>${get(a.serviceId).name}</strong></div><div class="summary-line"><span>Спеціаліст</span><strong>${escapeHtml(a.specialist)}</strong></div><div class="summary-line"><span>Дата і час</span><strong>${dateLabel(a.date)}, ${a.time}</strong></div><button class="primary" style="margin-top:22px" onclick="nav('account')">Перейти до кабінету</button></div></div>`}
function animateModalOut(done){const modal=document.querySelector('.modal-wrap');if(!modal){done();return}modal.classList.add('modal-exit');setTimeout(done,280)}
function closeModal(){animateModalOut(()=>{state.modal=null;renderModalNow()})}
function cartPage(){const selected=[...new Set(state.cart)].map(get);return `<div class="eyebrow">Ваші улюблені ритуали</div><h1>Кошик</h1><p class="lead">Зберіть час для себе — усе в одному місці.</p>${selected.length?`<div class="cart-list">${selected.map(s=>`<div class="cart-item" data-cart-id="${s.id}"><img src="${image(s.images[0],300)}" alt="${s.name}"><div class="cart-item-main"><h3>${s.name}</h3><p>${s.duration} · ${s.specialist}</p><strong>${money(s.price)} за послугу</strong><div class="qty-control"><button aria-label="Зменшити кількість: ${s.name}" onclick="decrementCart('${s.id}')">−</button><strong>${quantity(s.id)}</strong><button aria-label="Збільшити кількість: ${s.name}" onclick="addCart('${s.id}')">+</button></div></div><button class="remove" aria-label="Прибрати ${s.name}" onclick="removeCart('${s.id}')">${svg('x')}</button></div>`).join('')}</div><div class="cart-total"><span>Загальна вартість</span><strong>${money(state.cart.reduce((n,id)=>n+get(id).price,0))}</strong></div><button class="primary" onclick="startCartBooking()">Записатися</button><p style="font-size:10px;line-height:1.6;color:var(--muted);text-align:center;margin-top:12px">Час запису обирається окремо для кожної послуги.</p>`:`<div class="empty"><div class="empty-icon">${svg('bag')}</div><h2>Ваш кошик поки порожній</h2><p>Оберіть послуги, які подарують вам особливий час для себе.</p><button class="primary" onclick="nav('home')">Переглянути послуги</button></div>`}`}
function accountPage(){const a=state.appointments;const f=a[0]||state.form;const future=a.filter(x=>new Date(`${x.date}T${x.time}:00`)>=new Date());const past=a.filter(x=>new Date(`${x.date}T${x.time}:00`)<new Date());const item=(x,old)=>`<div class="appointment"><div class="appointment-head"><div><h3>${get(x.serviceId).name}</h3><small>${x.specialist}</small></div><span class="badge ${old?'past':''}">${old?'Завершено':'В обробці'}</span></div><div class="appointment-grid"><div><span>Дата</span><strong>${dateLabel(x.date)}</strong></div><div><span>Час</span><strong>${x.time}</strong></div><div><span>Спеціаліст</span><strong>${x.specialist}</strong></div><div><span>Код підтвердження</span><strong class="code">${x.code}</strong></div></div></div>`;return `<div class="eyebrow">Ваш особистий простір</div><h1>Кабінет</h1><div class="profile"><div class="profile-ava">${escapeHtml((f.name||'В')[0].toUpperCase())}</div><div><h2>${escapeHtml(f.name||'Ваша краса')}</h2><p>${escapeHtml(f.phone||'Ваш простір турботи')}</p></div></div><div class="section-head"><div><span class="eyebrow">Попереду прекрасне</span><h2>Активні записи</h2></div></div>${future.length?future.map(x=>item(x,false)).join(''):`<div class="empty" style="padding:25px 15px 35px"><div class="empty-icon">${svg('spark')}</div><p>Тут з’являться ваші майбутні візити.</p><button class="secondary" onclick="nav('home')">Обрати послугу</button></div>`}<div class="section-head" style="margin-top:26px"><div><span class="eyebrow">Приємні моменти</span><h2>Попередні записи</h2></div></div>${past.length?past.map(x=>item(x,true)).join(''):'<p class="lead">Історія ваших візитів з’явиться тут.</p>'}`}
function syncTelegramBack(){try{const tg=window.Telegram?.WebApp;if(tg){tg.BackButton.isVisible=['detail','form'].includes(state.view)||!!state.modal;tg.BackButton.onClick(back)}}catch{}}
function renderModalNow(){document.querySelector('.modal-wrap')?.remove();if(state.modal)document.getElementById('app').insertAdjacentHTML('beforeend',state.modal==='review'?reviewModal():successModal());syncTelegramBack()}
function renderNow(){const body=state.view==='detail'?detailPage():state.view==='form'?formPage():state.view==='cart'?cartPage():state.view==='account'?accountPage():home();document.getElementById('app').innerHTML=`<div class="shell"><header class="topbar"><div class="mark"><span class="spark">✦</span><div class="brand">Maison <em>Rose</em></div></div></header><main class="content" id="main">${body}</main><nav class="nav" aria-label="Основна навігація"><button class="${state.tab==='home'?'active':''}" onclick="nav('home')">${svg('home')}<span>Головна</span></button><button class="nav-cart ${state.tab==='cart'?'active':''}" onclick="nav('cart')">${state.cart.length?`<span class="nav-count">${state.cart.length}</span>`:''}${svg('bag')}<span>Кошик</span></button><button class="${state.tab==='account'?'active':''}" onclick="nav('account')">${svg('user')}<span>Кабінет</span></button></nav></div>`;renderToast();const gal=document.getElementById('gallery');if(gal){let sx=0;gal.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});gal.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>45)changeImage(dx<0?1:-1)},{passive:true})}renderModalNow()}
function render(resetScroll=false,animated=false){document.querySelectorAll('body > .screen-exit').forEach(el=>el.remove());const old=document.querySelector('#main');if(!animated||!old){renderNow();if(resetScroll)window.scrollTo({top:0,left:0,behavior:'instant'});return}const rect=old.getBoundingClientRect(),clone=old.cloneNode(true);clone.removeAttribute('id');clone.setAttribute('aria-hidden','true');clone.classList.add('screen-exit');clone.style.top=`${rect.top}px`;clone.style.left=`${rect.left}px`;clone.style.width=`${rect.width}px`;clone.style.height=`${rect.height}px`;document.body.appendChild(clone);renderNow();if(resetScroll)window.scrollTo({top:0,left:0,behavior:'instant'});const fresh=document.querySelector('#main');fresh?.classList.add('screen-enter');setTimeout(()=>{clone.remove();fresh?.classList.remove('screen-enter')},360)}
try{window.Telegram?.WebApp?.ready();window.Telegram?.WebApp?.expand()}catch{};render();
window.addEventListener('popstate',back);
</script><script src='portfolio.js'></script>
</body></html>
